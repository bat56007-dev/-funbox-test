<title>Funbox 抽獎連結整理</title>
<style>
  :root{
    --bg: #0E1A2B;
    --bg-2: #132540;
    --panel: #16294A;
    --accent: #FF7A29;
    --accent-2: #FFB454;
    --line: #2A3F63;
    --text: #EAF0FA;
    --text-dim: #9FB0CC;
    --done: #4A5A78;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, #1B3358 0%, transparent 45%),
      var(--bg);
    color:var(--text);
    font-family: -apple-system, 'PingFang TC', 'Noto Sans TC', system-ui, sans-serif;
    min-height:100vh;
    padding: env(safe-area-inset-top,20px) 14px calc(env(safe-area-inset-bottom,20px) + 30px);
    -webkit-text-size-adjust: 100%;
  }
  .wrap{ max-width: 640px; margin: 0 auto; }

  /* HERO */
  .hero{
    background: linear-gradient(135deg, var(--bg-2), #0C1830);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px 18px 16px;
    margin-bottom: 14px;
  }
  .brand{
    font-size:12px; letter-spacing:2px; color:var(--accent-2);
    text-transform:uppercase; font-weight:700; margin-bottom:8px;
  }
  h1{
    margin:0 0 6px;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.3px;
    line-height:1.3;
  }
  .sub{ font-size:13px; color:var(--text-dim); }

  /* COUNTY TABS */
  .tabs{
    display:flex; gap:8px;
    margin-bottom: 14px;
    overflow-x:auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex-shrink:0;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 700;
    padding: 9px 16px;
    border-radius: 999px;
    white-space:nowrap;
  }
  .tab.active{
    background: linear-gradient(135deg, var(--accent), #E85D00);
    border-color: transparent;
    color: #fff;
  }

  /* STORE CARD */
  .store{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .store-head{
    padding: 13px 15px;
    display:flex; align-items:center; justify-content:space-between;
    gap: 10px;
  }
  .store-title{ min-width:0; }
  .store-name{ font-size: 15px; font-weight: 700; }
  .store-period{ font-size: 11.5px; color: var(--text-dim); margin-top:2px; }
  .chevron{
    flex-shrink:0;
    width: 22px; height:22px;
    color: var(--text-dim);
    transition: transform .15s ease;
  }
  .store.open .chevron{ transform: rotate(180deg); }
  .store-list{
    display:none;
    border-top: 1px solid var(--line);
    padding: 6px 10px 10px;
  }
  .store.open .store-list{ display:block; }

  .item{
    display:flex; align-items:center; justify-content:space-between;
    gap: 10px;
    padding: 9px 6px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .item:last-child{ border-bottom:none; }
  .name{ font-size: 13.5px; font-weight:600; min-width:0; word-break: break-word; }

  .btn{
    flex-shrink:0;
    display:inline-flex; align-items:center; gap:4px;
    background: linear-gradient(135deg, var(--accent), #E85D00);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    text-decoration:none;
    padding: 8px 14px;
    border-radius: 999px;
    border:none;
  }
  .btn.done{
    background: var(--done);
    color: #C7D2E8;
  }

  footer{
    text-align:center;
    color: var(--text-dim);
    font-size: 11.5px;
    margin-top: 18px;
    line-height:1.6;
  }
</style>
</head>

  document.getElementById('pageSub').textContent = META.note + "　" + META.period;

  const counties = Object.keys(DATA);
  let activeCounty = counties[0];

  // 用 sessionStorage 記錄按過的連結：
  // - 重新整理頁面 -> 還記得（分頁還在）
  // - 整個分頁/瀏覽器關掉 -> 自動清空（分頁工作階段結束）
  const STORAGE_KEY = 'funbox_clicked_urls';
  function loadClicked(){
    try{
      const raw = sessionStorage.getItem(STORAGE_KEY);
      return raw ? new Set(JSON.parse(raw)) : new Set();
    }catch(e){
      return new Set(); // 例如在受限環境裡 sessionStorage 不可用，退回本次瀏覽記憶
    }
  }
  function saveClicked(){
    try{
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify([...clicked]));
    }catch(e){ /* 存不了就算了，不影響其他功能 */ }
  }
  const clicked = loadClicked();

  const tabsEl = document.getElementById('tabs');
  const storesEl = document.getElementById('stores');

  function renderTabs(){
    tabsEl.innerHTML = counties.map(c => {
      const activeCount = DATA[c].filter(s => s.active !== false).length;
      return `<button class="tab${c===activeCounty?' active':''}" data-county="${c}">${c}（${activeCount}）</button>`;
    }).join('');
    tabsEl.querySelectorAll('.tab').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        activeCounty = btn.dataset.county;
        renderTabs();
        renderStores();
      });
    });
  }

  function renderStores(){
    const list = DATA[activeCounty].filter(s => s.active !== false);
    if(list.length === 0){
      storesEl.innerHTML = `<div style="text-align:center; color:var(--text-dim); padding:30px 10px; font-size:14px;">本次${activeCounty}沒有店家在抽獎</div>`;
      return;
    }
    storesEl.innerHTML = list.map((s, idx) => `
      <div class="store" data-idx="${idx}">
        <div class="store-head">
          <div class="store-title">
            <div class="store-name">${s.store}</div>
            <div class="store-period">抽選時間：${s.period}</div>
          </div>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="store-list">
          ${s.items.map(it => `
            <div class="item">
              <div class="name">${it.code} ${it.name}</div>
              <a class="btn${clicked.has(it.url)?' done':''}" href="${it.url}" target="_blank" rel="noopener noreferrer" data-url="${it.url}">
                ${clicked.has(it.url) ? '已抽過' : '抽獎'}
              </a>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');

    storesEl.querySelectorAll('.store-head').forEach(head=>{
      head.addEventListener('click', ()=>{
        head.parentElement.classList.toggle('open');
      });
    });

    storesEl.querySelectorAll('.btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const url = btn.dataset.url;
        clicked.add(url);
        saveClicked();
        btn.classList.add('done');
        btn.textContent = '已抽過';
      });
    });
  }

  renderTabs();
  renderStores();
