<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Funbox 抽獎連結整理</title>
<style>
  :root{
    --bg: #0E1A2B;
    --bg-2: #132540;
    --panel: #16294A;
    --accent: #FF7A29;
    --accent-2: #FFB454;
    --line: #2A3F63;
    --text: #EAF0FA;
    --text-dim: #9FB0CC;
    --done: #4A5A78;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, #1B3358 0%, transparent 45%),
      var(--bg);
    color:var(--text);
    font-family: -apple-system, 'PingFang TC', 'Noto Sans TC', system-ui, sans-serif;
    min-height:100vh;
    padding: env(safe-area-inset-top,20px) 14px calc(env(safe-area-inset-bottom,20px) + 30px);
    -webkit-text-size-adjust: 100%;
  }
  .wrap{ max-width: 640px; margin: 0 auto; }

  /* HERO */
  .hero{
    background: linear-gradient(135deg, var(--bg-2), #0C1830);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px 18px 16px;
    margin-bottom: 14px;
  }
  .brand{
    font-size:12px; letter-spacing:2px; color:var(--accent-2);
    text-transform:uppercase; font-weight:700; margin-bottom:8px;
  }
  h1{
    margin:0 0 6px;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.3px;
    line-height:1.3;
  }
  .sub{ font-size:13px; color:var(--text-dim); }

  /* COUNTY TABS */
  .tabs{
    display:flex; gap:8px;
    margin-bottom: 14px;
    overflow-x:auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex-shrink:0;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 700;
    padding: 9px 16px;
    border-radius: 999px;
    white-space:nowrap;
  }
  .tab.active{
    background: linear-gradient(135deg, var(--accent), #E85D00);
    border-color: transparent;
    color: #fff;
  }

  /* STORE CARD */
  .store{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .store-head{
    padding: 13px 15px;
    display:flex; align-items:center; justify-content:space-between;
    gap: 10px;
  }
  .store-title{ min-width:0; }
  .store-name{ font-size: 15px; font-weight: 700; }
  .store-period{ font-size: 11.5px; color: var(--text-dim); margin-top:2px; }
  .chevron{
    flex-shrink:0;
    width: 22px; height:22px;
    color: var(--text-dim);
    transition: transform .15s ease;
  }
  .store.open .chevron{ transform: rotate(180deg); }
  .store-list{
    display:none;
    border-top: 1px solid var(--line);
    padding: 6px 10px 10px;
  }
  .store.open .store-list{ display:block; }

  .item{
    display:flex; align-items:center; justify-content:space-between;
    gap: 10px;
    padding: 9px 6px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .item:last-child{ border-bottom:none; }
  .name{ font-size: 13.5px; font-weight:600; min-width:0; word-break: break-word; }

  .btn{
    flex-shrink:0;
    display:inline-flex; align-items:center; gap:4px;
    background: linear-gradient(135deg, var(--accent), #E85D00);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    text-decoration:none;
    padding: 8px 14px;
    border-radius: 999px;
    border:none;
  }
  .btn.done{
    background: var(--done);
    color: #C7D2E8;
  }

  footer{
    text-align:center;
    color: var(--text-dim);
    font-size: 11.5px;
    margin-top: 18px;
    line-height:1.6;
  }

  /* 連續抽選模式 */
  .seq-bar{
    display:flex; align-items:center; gap:10px;
    margin-bottom: 14px;
  }
  .seq-start-btn{
    background: linear-gradient(135deg, var(--accent), #E85D00);
    color:#fff; border:none; font-weight:700; font-size:13.5px;
    padding: 9px 16px; border-radius: 999px;
    box-shadow: 0 4px 14px rgba(255,122,41,0.28);
  }
  .seq-hint{ font-size: 12px; color: var(--text-dim); }

  .seq-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 20px;
    text-align:center;
  }
  .seq-progress{
    font-size: 12.5px; color: var(--accent-2); font-weight:700;
    letter-spacing: 0.5px; margin-bottom: 10px;
  }
  .seq-store{ font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
  .seq-name{ font-size: 19px; font-weight: 800; margin-bottom: 22px; line-height:1.4; }
  .seq-actions{ display:flex; flex-direction:column; gap: 10px; }
  .seq-actions a, .seq-actions button{
    display:block; width:100%;
    border:none; border-radius: 14px;
    padding: 14px; font-size: 15px; font-weight:700;
    text-decoration:none; cursor:pointer;
  }
  .seq-open{
    background: linear-gradient(135deg, var(--accent), #E85D00);
    color:#fff;
  }
  .seq-next{
    background: #2E7D4F;
    color:#fff;
  }
  .seq-skip{
    background: transparent;
    border: 1px solid var(--line) !important;
    color: var(--text-dim);
  }
  .seq-end{
    background: transparent;
    color: var(--text-dim);
    font-size: 13px !important;
    font-weight:600 !important;
    padding: 10px !important;
    text-decoration: underline;
  }
  .seq-done-msg{
    text-align:center; padding: 40px 10px;
  }
  .seq-done-msg .big{ font-size: 18px; font-weight:800; margin-bottom: 8px; }
  .seq-done-msg .small{ font-size: 13px; color: var(--text-dim); margin-bottom: 20px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="brand">Funbox 抽獎快選</div>
    <h1 id="pageTitle"></h1>
    <div class="sub" id="pageSub"></div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="seq-bar" id="seqBar">
    <button class="seq-start-btn" id="seqStartBtn">⚡ 連續抽選模式</button>
    <span class="seq-hint" id="seqHint"></span>
  </div>

  <div id="stores"></div>
  <div id="seqMode" style="display:none;"></div>

  <footer id="normalFooter">點「抽獎」開新分頁前往，按過的項目會變灰色（還是可以再按一次）<br>重新整理頁面仍會記得，但把分頁整個關掉後會清空</footer>
</div>

      { store:"來玩聚 員林店", period:"2026/09/11 10:00~2026/09/12 21:00", active:false, items:[

    ],
    "台南市": [
      { store:"FUNBOX-台南南紡店", period:"2026/09/11 11:00~2026/09/12 21:00", active:false, items:[
        {code:"BX-00", name:"蒼龍神劍3-60F V2 $350", url:"https://lin.ee/sOES69Y"},

        {code:"BX-45", name:"武士魂斬 $325", url:"https://lin.ee/5DYWzKP"},
        {code:"CX-13", name:"龍王閃擊 $495", url:"https://lin.ee/nIFAjIM"},
        {code:"UX-02", name:"惡魔戰錘 $395", url:"https://lin.ee/uqPGQfF"},
        {code:"UX-19", name:"子彈獅鷲H $550", url:"https://lin.ee/874mNB8"},
        {code:"UX-20", name:"榮耀武神LF $595", url:"https://lin.ee/xsKMnPI"},
        {code:"UX-21", name:"惡魔冥界改造組 $895", url:"https://lin.ee/YEjbfuf"},
        {code:"BXG-01", name:"烈焰飛鳳S $350", url:"https://lin.ee/nm8hxAb"},
        {code:"BXG-04", name:"銀牙烈虎S $350", url:"https://lin.ee/83Kw1XX"},
        {code:"CX-00", name:"福音戰士改造組 $1395", url:"https://lin.ee/y2Z1zC9"}
      ]},
      { store:"Funbox台南三井店", period:"2026/09/11 11:00~2026/09/12 20:30", active:false, items:[
        {code:"CX-00", name:"新世紀福音戰士改造組", url:"https://lin.ee/PX6pbXl"}
      ]},
      { store:"FUNBOX 台南遠百", period:"2026/09/11 11:00~2026/09/12 21:00", active:false, items:[
        {code:"CX-00", name:"新世紀福音戰士改造組", url:"https://lin.ee/Wu5v4s6"}
      ]}
    ]
  };

  const META = { period: "2026/08/28 ~ 2026/08/29", note: "台北市 · 新北市 · 桃園市 · 台中市 · 台南市 · 彰化縣 · 新竹市 · 新竹縣" };

  document.getElementById('pageTitle').textContent = "抽獎連結整理";
  document.getElementById('pageSub').textContent = META.note + "　" + META.period;

  const counties = Object.keys(DATA);
  let activeCounty = counties[0];

  // 用 sessionStorage 記錄按過的連結：
  // - 重新整理頁面 -> 還記得（分頁還在）
  // - 整個分頁/瀏覽器關掉 -> 自動清空（分頁工作階段結束）
  const STORAGE_KEY = 'funbox_clicked_urls';
  function loadClicked(){
    try{
      const raw = sessionStorage.getItem(STORAGE_KEY);
      return raw ? new Set(JSON.parse(raw)) : new Set();
    }catch(e){
      return new Set(); // 例如在受限環境裡 sessionStorage 不可用，退回本次瀏覽記憶
    }
  }
  function saveClicked(){
    try{
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify([...clicked]));
    }catch(e){ /* 存不了就算了，不影響其他功能 */ }
  }
  const clicked = loadClicked();

  const tabsEl = document.getElementById('tabs');
  const storesEl = document.getElementById('stores');

  function renderTabs(){
    tabsEl.innerHTML = counties.map(c => {
      const activeCount = DATA[c].filter(s => s.active !== false).length;
      return `<button class="tab${c===activeCounty?' active':''}" data-county="${c}">${c}（${activeCount}）</button>`;
    }).join('');
    tabsEl.querySelectorAll('.tab').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        activeCounty = btn.dataset.county;
        renderTabs();
        renderStores();
        updateSeqHint();
      });
    });
  }

  // ------------------------------------------------------------------
  // 連續抽選模式
  // ------------------------------------------------------------------
  const seqModeEl = document.getElementById('seqMode');
  const seqStartBtn = document.getElementById('seqStartBtn');
  const seqHintEl = document.getElementById('seqHint');
  const normalFooterEl = document.getElementById('normalFooter');

  let seqQueue = [];
  let seqIndex = 0;
  let seqOpened = false; // 這一筆是否已經按過「開啟抽選」

  function buildSeqQueue(){
    const list = DATA[activeCounty].filter(s => s.active !== false);
    const queue = [];
    list.forEach(s => {
      s.items.forEach(it => {
        if(!clicked.has(it.url)){ // 已抽過的不排進隊列
          queue.push({ store: s.store, code: it.code, name: it.name, url: it.url });
        }
      });
    });
    return queue;
  }

  function updateSeqHint(){
    const remaining = buildSeqQueue().length;
    seqHintEl.textContent = remaining > 0 ? `${activeCounty} 還有 ${remaining} 個可抽` : `${activeCounty} 目前沒有未抽過的獎項`;
    seqStartBtn.disabled = remaining === 0;
    seqStartBtn.style.opacity = remaining === 0 ? '0.5' : '1';
  }

  function startSeqMode(){
    seqQueue = buildSeqQueue();
    seqIndex = 0;
    seqOpened = false;
    if(seqQueue.length === 0) return;
    storesEl.style.display = 'none';
    tabsEl.style.display = 'none';
    seqBarEl.style.display = 'none';
    normalFooterEl.style.display = 'none';
    seqModeEl.style.display = 'block';
    renderSeqCard();
  }

  function endSeqMode(){
    seqModeEl.style.display = 'none';
    storesEl.style.display = '';
    tabsEl.style.display = '';
    seqBarEl.style.display = '';
    normalFooterEl.style.display = '';
    renderStores(); // 重新整理清單，反映剛剛抽過的灰色狀態
    updateSeqHint();
  }

  function renderSeqCard(){
    if(seqIndex >= seqQueue.length){
      seqModeEl.innerHTML = `
        <div class="seq-card">
          <div class="seq-done-msg">
            <div class="big">🎉 本次已全部跑完</div>
            <div class="small">${activeCounty} 這一輪的獎項都處理完了</div>
            <button class="seq-end" id="seqEndBtn2" style="text-decoration:none; border:1px solid var(--line); border-radius:14px; padding:12px; width:100%; color:var(--text);">回到清單</button>
          </div>
        </div>
      `;
      document.getElementById('seqEndBtn2').addEventListener('click', endSeqMode);
      return;
    }
    const cur = seqQueue[seqIndex];
    seqOpened = clicked.has(cur.url);
    seqModeEl.innerHTML = `
      <div class="seq-card">
        <div class="seq-progress">第 ${seqIndex + 1} / ${seqQueue.length} 個</div>
        <div class="seq-store">${cur.store}</div>
        <div class="seq-name">${cur.code} ${cur.name}</div>
        <div class="seq-actions">
          ${seqOpened
            ? `<button class="seq-next" id="seqNextBtn">✅ 完成，下一個</button>`
            : `<a class="seq-open" id="seqOpenBtn" href="${cur.url}" target="_blank" rel="noopener noreferrer">⚡ 開啟抽選</a>
               <button class="seq-skip" id="seqSkipBtn">跳過，下一個</button>`
          }
          <button class="seq-end" id="seqEndBtn">結束連續抽選</button>
        </div>
      </div>
    `;
    const openBtn = document.getElementById('seqOpenBtn');
    if(openBtn){
      openBtn.addEventListener('click', ()=>{
        clicked.add(cur.url);
        saveClicked();
        seqOpened = true;
        renderSeqCard();
      });
    }
    const nextBtn = document.getElementById('seqNextBtn');
    if(nextBtn){
      nextBtn.addEventListener('click', ()=>{
        seqIndex++;
        renderSeqCard();
      });
    }
    const skipBtn = document.getElementById('seqSkipBtn');
    if(skipBtn){
      skipBtn.addEventListener('click', ()=>{
        seqIndex++;
        renderSeqCard();
      });
    }
    document.getElementById('seqEndBtn').addEventListener('click', endSeqMode);
  }

  const seqBarEl = document.getElementById('seqBar');
  seqStartBtn.addEventListener('click', startSeqMode);

  function renderStores(){
    const list = DATA[activeCounty].filter(s => s.active !== false);
    if(list.length === 0){
      storesEl.innerHTML = `<div style="text-align:center; color:var(--text-dim); padding:30px 10px; font-size:14px;">本次${activeCounty}沒有店家在抽獎</div>`;
      return;
    }
    storesEl.innerHTML = list.map((s, idx) => `
      <div class="store" data-idx="${idx}">
        <div class="store-head">
          <div class="store-title">
            <div class="store-name">${s.store}</div>
            <div class="store-period">抽選時間：${s.period}</div>
          </div>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="store-list">
          ${s.items.map(it => `
            <div class="item">
              <div class="name">${it.code} ${it.name}</div>
              <a class="btn${clicked.has(it.url)?' done':''}" href="${it.url}" target="_blank" rel="noopener noreferrer" data-url="${it.url}">
                ${clicked.has(it.url) ? '已抽過' : '抽獎'}
              </a>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');

    storesEl.querySelectorAll('.store-head').forEach(head=>{
      head.addEventListener('click', ()=>{
        head.parentElement.classList.toggle('open');
      });
    });

    storesEl.querySelectorAll('.btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const url = btn.dataset.url;
        clicked.add(url);
        saveClicked();
        btn.classList.add('done');
        btn.textContent = '已抽過';
      });
    });
  }

  renderTabs();
  renderStores();
  updateSeqHint();
</script>
